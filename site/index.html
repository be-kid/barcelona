<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>바르셀로나 4박5일 · 우리 일정</title>
  <meta name="description" content="둘이서 같이 보는 바르셀로나 여행 일정" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Outfit:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app">
    <aside class="panel" id="panel">
      <header class="panel-head">
        <p class="eyebrow">Barcelona · 4N / 5D</p>
        <h1 class="brand">우리 일정</h1>
        <p class="lede" id="lede">링크만 있으면 같이 볼 수 있어요.</p>
        <div class="stay" id="stay"></div>
        <div class="share-row">
          <button type="button" class="btn btn-primary" id="copy-link">링크 복사</button>
          <a class="btn btn-ghost" id="all-maps" href="#" target="_blank" rel="noopener">오늘 동선</a>
        </div>
      </header>

      <nav class="day-tabs" id="day-tabs" aria-label="날짜"></nav>
      <div class="day-body" id="day-body"></div>
      <footer class="panel-foot">
        <p>수정은 일정을 고친 뒤 다시 배포하면 반영됩니다. · <a href="https://github.com/be-kid/barcelona" target="_blank" rel="noopener">소스</a></p>
      </footer>
    </aside>

    <main class="map-pane">
      <div id="map" role="application" aria-label="일정 지도"></div>
      <button type="button" class="map-toggle" id="toggle-panel" aria-label="일정 패널 토글">일정</button>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="./app.js"></script>
</body>
</html>
